# Local infrastructure: PostgreSQL 16 + PostGIS, and Redis.
#   docker compose up -d          # databases only (run the apps with npm run dev)
#   docker compose --profile app up --build   # everything, including the API and web app
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: droba
      POSTGRES_PASSWORD: droba
      POSTGRES_DB: droba
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droba"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://droba:droba@postgres:5432/droba?schema=public&connection_limit=20
      REDIS_URL: redis://redis:6379
      COOKIE_SECURE: "false"
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
