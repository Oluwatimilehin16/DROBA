<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Droba</title>
<meta name="description" content="Droba: Nigeria's marketplace for pre-loved fashion.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout concept: an editorial pre-loved market. White page, cream for supporting surfaces
   (info boxes, strips, footer, image wells), Droba red only for actions, badges and the condition scale. Seller Studio swaps to a
   deep wine sidebar so sellers always know which side of Droba they are on. */
:root {
  --red: #C8102E;          /* Droba red: CTAs, active states */
  --red-deep: #9E0B22;     /* hover / pressed */
  --wine: #3B0A12;         /* Seller Studio chrome, dark sections */
  --oxblood: #7A0A1C;      /* product names, emphasis */
  --wine-3: #24060B;
  --accent-soft: #FF9AA8;  /* light accent on dark surfaces */
  --wine-2: #52101B;
  --blush: #FDEEEC;        /* soft red wash for tags & highlights */
  --cream: #FCF9F4;        /* light cream: supporting surfaces */
  --cream-2: #F5EFE6;      /* slightly deeper cream: wells, tracks */
  --white: #FFFFFF;
  --ink: #1F1414;          /* warm near-black text */
  --ink-2: #4A3C39;
  --muted: #7D6C66;
  --line: #EFE8DE;
  --line-2: #E3D9CB;
  --ok: #2E7D4F;  --ok-bg: #E4F2E8;
  --warn: #A66410; --warn-bg: #FBEFD9;
  --info: #285E9E; --info-bg: #E3ECF7;

  --f-display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --f-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;

  --r-sm: 8px; --r-md: 14px; --r-lg: 22px; --r-pill: 999px;
  --sh-1: 0 1px 2px rgba(59,10,18,.06), 0 2px 8px rgba(59,10,18,.05);
  --sh-2: 0 10px 30px -10px rgba(59,10,18,.25);
  --wrap: 1320px;
  --hdr: 64px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--white); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; margin: 0; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; line-height: 1.08; letter-spacing: -0.02em; text-wrap: balance; font-weight: 700; }
p { margin: 0; }
.serif { font-family: var(--f-serif); font-style: italic; font-weight: 400; letter-spacing: 0; }
.eyebrow { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 16px; height: 16px; }
.ic.lg { width: 24px; height: 24px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: var(--r-pill); font-weight: 650; font-size: 15px; white-space: nowrap; transition: background .15s, color .15s, border-color .15s, transform .1s; border: 1.5px solid transparent; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--red); color: var(--white); }
.btn-primary:hover { background: var(--red-deep); }
.btn-dark { background: var(--ink); color: var(--white); }
.btn-dark:hover { background: var(--wine); }
.btn-outline { border-color: var(--ink); color: var(--ink); background: transparent; }
.btn-outline:hover { background: var(--ink); color: var(--white); }
.btn-outline-red { border-color: var(--red); color: var(--red); }
.btn-outline-red:hover { background: var(--red); color: var(--white); }
.btn-ghost { background: var(--white); color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--ink); }
.btn-light { background: var(--white); color: var(--ink); }
.btn-sm { height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn-lg { height: 54px; padding: 0 28px; font-size: 16px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--ink); position: relative; transition: background .15s; }
.icon-btn:hover { background: var(--cream-2); }
.link { color: var(--red); font-weight: 650; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.count-dot { position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: var(--white); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--white); }

/* ---------- Chips / tags ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: var(--r-pill); background: var(--white); border: 1.5px solid var(--line); font-weight: 600; font-size: 14px; white-space: nowrap; transition: all .15s; }
.chip:hover { border-color: var(--ink-2); }
.chip.on { background: var(--ink); color: var(--white); border-color: var(--ink); }
.chip.on-red { background: var(--red); border-color: var(--red); color: var(--white); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.tag-bestseller { background: var(--red); color: var(--white); }
.tag-trending { background: var(--ink); color: var(--white); }
.tag-new { background: var(--white); color: var(--ink); }
.tag-popular { background: var(--blush); color: var(--red-deep); }
.tag-sponsored { background: rgba(255,255,255,.92); color: var(--muted); letter-spacing: .1em; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 650; background: var(--cream-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.red { background: var(--blush); color: var(--red-deep); }
.pill.dark { background: var(--ink); color: var(--white); }
.vbadge { display: inline-flex; width: 15px; height: 15px; color: var(--red); vertical-align: -2px; flex: none; }
.vbadge.biz { color: var(--ink); }
.vbadge svg { width: 100%; height: 100%; }

/* ---------- Condition (signature component) ---------- */
.cond { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 6px; border-radius: 6px; background: rgba(255,255,255,.94); font-size: 11.5px; font-weight: 700; color: var(--ink); }
.cond-bars { display: inline-flex; gap: 2px; }
.cond-bars i { width: 4px; height: 10px; border-radius: 1px; background: var(--line-2); }
.cond-bars i.f { background: var(--red); }
.cond-scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.cond-scale .seg { height: 8px; border-radius: 4px; background: var(--cream-2); }
.cond-scale .seg.f { background: var(--red); }
.cond-labels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 8px; }
.cond-labels span.cur { color: var(--ink); font-weight: 800; }

/* ---------- Header (shopping) ---------- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: rgba(255,255,255,.94); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.hdr-row { display: flex; align-items: center; gap: 16px; height: var(--hdr); }
.logo { display: inline-flex; align-items: center; gap: 9px; flex: none; }
.logo-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--red); color: var(--white); display: grid; place-items: center; }
.logo-mark .ic { width: 22px; height: 22px; stroke-width: 2; }
.logo-word { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: -0.045em; line-height: 1; }
.logo.light .logo-word { color: var(--white); }
.logo.light .logo-mark { background: var(--white); color: var(--red); }
.search { position: relative; flex: 1; max-width: 560px; }
.search-box { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px 0 16px; border-radius: var(--r-pill); background: var(--cream); border: 1.5px solid transparent; transition: border-color .15s, background .15s; }
.search-box:focus-within { border-color: var(--ink); background: var(--white); }
.search-box input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; height: 100%; font-size: 15px; }
.search-box input::placeholder { color: var(--muted); }
.search-go { width: 34px; height: 34px; border-radius: 50%; background: var(--red); color: var(--white); display: grid; place-items: center; flex: none; }
.search-pop { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--white); border-radius: var(--r-md); box-shadow: var(--sh-2); border: 1px solid var(--line); padding: 16px; z-index: 50; }
.search-pop h5 { margin: 0 0 10px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.search-pop .chips .chip { height: 34px; font-size: 13.5px; }
.sugg-list { display: grid; gap: 2px; margin-top: 4px; }
.sugg-list button { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-align: left; font-weight: 550; }
.sugg-list button:hover { background: var(--cream); }
.sugg-list b { color: var(--red); }
.hdr-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.mode-switch { display: inline-flex; padding: 3px; border-radius: var(--r-pill); background: var(--cream-2); gap: 2px; }
.mode-switch button { height: 34px; padding: 0 14px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.mode-switch button.on { background: var(--white); color: var(--ink); box-shadow: var(--sh-1); }
.mode-switch.dark { background: rgba(255,255,255,.08); }
.mode-switch.dark button { color: rgba(255,255,255,.7); }
.mode-switch.dark button.on { background: var(--white); color: var(--wine); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--wine); color: var(--white); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; overflow: hidden; }
.avatar.lg { width: 64px; height: 64px; font-size: 22px; }
.avatar.red { background: var(--red); }
.subnav { display: flex; align-items: center; gap: 28px; height: 48px; overflow-x: auto; scrollbar-width: none; }
.subnav::-webkit-scrollbar { display: none; }
.subnav a, .subnav button { font-weight: 650; font-size: 14.5px; color: var(--ink-2); white-space: nowrap; height: 100%; display: inline-flex; align-items: center; border-bottom: 2.5px solid transparent; }
.subnav .on { color: var(--ink); border-color: var(--red); }
.subnav .sep { width: 1px; height: 18px; background: var(--line-2); flex: none; }
.subnav .hot { color: var(--red); }
.menu-pop { position: absolute; right: 0; top: calc(100% + 8px); width: 290px; background: var(--white); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--sh-2); padding: 8px; z-index: 60; }
.menu-pop .mp-head { display: flex; gap: 12px; align-items: center; padding: 10px 10px 14px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.menu-pop .mp-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 14.5px; text-align: left; }
.menu-pop .mp-item:hover { background: var(--cream); }
.menu-pop .mp-switch { margin: 6px 4px; padding: 12px; border-radius: 12px; background: var(--wine); color: var(--white); display: flex; align-items: center; gap: 12px; width: calc(100% - 8px); text-align: left; }
.menu-pop .mp-switch small { display: block; opacity: .7; font-size: 12.5px; font-weight: 500; }

/* Mobile bottom tab bar */
.tabbar { display: none; }
@media (max-width: 760px) {
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--white); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 650; color: var(--muted); padding: 4px 0; position: relative; }
  .tabbar button.on { color: var(--red); }
  .tabbar .tb-sell span.plus { width: 44px; height: 44px; margin-top: -18px; border-radius: 50%; background: var(--red); color: var(--white); display: grid; place-items: center; box-shadow: 0 6px 16px -4px rgba(200,16,46,.6); border: 3px solid var(--white); }
  .tabbar .count-dot { top: -2px; right: calc(50% - 20px); }
  .page { padding-bottom: 84px; }
}

/* ---------- Home ---------- */
.feed-tabs { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; padding-block: 22px 14px; }
.seg { display: inline-flex; padding: 4px; background: var(--white); border-radius: var(--r-pill); border: 1px solid var(--line); }
.seg button { height: 40px; padding: 0 20px; border-radius: var(--r-pill); font-weight: 700; font-size: 14.5px; color: var(--ink-2); }
.seg button.on { background: var(--red); color: var(--white); }
.tuned { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); flex-wrap: wrap; }
.tuned b { font-weight: 700; color: var(--ink); }
.hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; margin-bottom: 26px; }
.hero-main { position: relative; border-radius: var(--r-lg); background: var(--wine); color: var(--white); overflow: hidden; padding: clamp(24px, 4vw, 44px); display: flex; flex-direction: column; justify-content: flex-end; min-height: 340px; isolation: isolate; }
.hero-main img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.hero-main::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(59,10,18,.3) 0%, rgba(59,10,18,.45) 40%, rgba(59,10,18,.92) 100%); z-index: -1; }
.hero-main h1 { font-size: clamp(34px, 4.6vw, 58px); font-weight: 800; letter-spacing: -0.035em; max-width: 13ch; }
.hero-main h1 .serif { font-size: 1.08em; }
.hero-main p { margin-top: 12px; max-width: 42ch; opacity: .88; font-size: 16px; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.hero-side { display: grid; grid-template-rows: 1fr 1fr; gap: 14px; }
.hero-card { position: relative; border-radius: var(--r-lg); overflow: hidden; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 160px; }
.hero-card.red { background: var(--red); color: var(--white); }
.hero-card.cream { background: var(--cream); }
.hero-card h3 { font-size: 24px; font-weight: 750; max-width: 16ch; }
.hero-card .grades { display: flex; gap: 6px; flex-wrap: wrap; }
.hero-card .grades span { font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 6px; background: var(--white); }
.hero-card .grades span:first-child { background: var(--red); color: var(--white); }
.hero-card .hc-img { position: absolute; right: -10px; bottom: -10px; width: 46%; height: 115%; object-fit: cover; border-radius: 18px 0 0 0; opacity: .95; }
.hero-card.red .hc-body { max-width: 56%; position: relative; z-index: 1; }
.cat-rail { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 12px; margin-bottom: 34px; }
.cat-tile { text-align: center; line-height: 1.25; }
.cat-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 650; font-size: 13.5px; }
.cat-tile .ct-img { width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: var(--cream); border: 1.5px solid var(--line); transition: border-color .15s, transform .2s; }
.cat-tile .ct-img img { width: 100%; height: 100%; object-fit: cover; }
.cat-tile:hover .ct-img { border-color: var(--red); transform: translateY(-2px); }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.sec-head h2 { font-size: clamp(24px, 2.6vw, 32px); }
.sec-head p { color: var(--muted); margin-top: 4px; }

/* ---------- Product grid & card ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 22px 16px; }
.grid.g4, .grid.feed { grid-template-columns: repeat(4, minmax(0,1fr)); }
.pcard { display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative; }
.pcard-media { position: relative; aspect-ratio: 4/5; border-radius: var(--r-md); overflow: hidden; background: var(--cream-2); }
.pcard-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.pcard:hover .pcard-media img { transform: scale(1.04); }
.pcard-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.pcard-top > * { pointer-events: auto; }
.heart { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.94); display: grid; place-items: center; color: var(--ink); transition: transform .15s; }
.heart:hover { transform: scale(1.08); }
.heart.on { color: var(--red); }
.heart.on .ic { fill: var(--red); }
.store-logo.round { border-radius: 50% !important; }
.pcard-bottom { position: absolute; left: 10px; bottom: 10px; }
.pcard-info { display: grid; gap: 2px; min-width: 0; }
.pcard-seller { max-width: 100%; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ink); min-width: 0; }
.pcard-seller span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard-title { display: block; width: 100%; text-align: left; font-size: 14.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.price { font-family: var(--f-display); font-weight: 750; font-size: 18px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.pcard-meta { font-size: 12.5px; color: var(--muted); }
.add-cart { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--ink); transition: all .15s; flex: none; }
.add-cart:hover { background: var(--red); border-color: var(--red); color: var(--white); }
.add-cart.in { background: var(--ink); border-color: var(--ink); color: var(--white); }
.pcard.sponsored .pcard-media { outline: 1.5px solid var(--line-2); outline-offset: 3px; }
.pcard.sold .pcard-media::after { content: "SOLD"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(31,20,20,.55); color: var(--white); font-family: var(--f-display); font-size: 28px; font-weight: 800; letter-spacing: .1em; }

/* Store row */
.stores { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.store-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .2s, transform .2s; }
.store-card:hover { box-shadow: var(--sh-2); transform: translateY(-2px); }
.store-card .sc-banner { height: 84px; position: relative; background: var(--cream-2); }
.store-card .sc-banner img { width: 100%; height: 100%; object-fit: cover; }
.store-card .sc-body { padding: 0 16px 16px; display: grid; gap: 4px; }
.store-logo { width: 54px; height: 54px; border-radius: 16px; background: var(--wine); color: var(--white); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 20px; border: 3px solid var(--white); margin-top: -27px; position: relative; }
.store-card h4 { font-size: 17px; display: flex; align-items: center; gap: 5px; margin-top: 6px; }
.store-card .sc-meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.store-thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.store-thumbs img { aspect-ratio: 1; object-fit: cover; border-radius: 8px; width: 100%; }

/* Promise strip */
.promise { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0; background: var(--cream); border: 0; border-radius: var(--r-lg); margin-block: 40px; }
.promise > div { padding: 22px; display: flex; gap: 14px; align-items: flex-start; }
.promise > div + div { border-left: 1px solid var(--line); }
.promise .p-ic { width: 42px; height: 42px; border-radius: 12px; background: var(--white); color: var(--red); display: grid; place-items: center; flex: none; }
.promise h4 { font-size: 15.5px; font-family: var(--f-body); font-weight: 750; letter-spacing: 0; }
.promise p { font-size: 13.5px; color: var(--muted); margin-top: 2px; }

/* Sell banner */
.sell-band { background: var(--wine); color: var(--white); border-radius: var(--r-lg); padding: clamp(26px, 4vw, 48px); display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; align-items: center; margin-block: 40px; position: relative; overflow: hidden; }
.sell-band h2 { font-size: clamp(28px, 3.4vw, 44px); font-weight: 800; }
.sell-band p { opacity: .8; margin-top: 10px; max-width: 46ch; }
.sell-steps { display: grid; gap: 10px; }
.sell-steps div { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); }
.sell-steps b { width: 30px; height: 30px; border-radius: 50%; background: var(--red); display: grid; place-items: center; font-size: 14px; flex: none; }

/* Footer */
.footer { background: var(--cream); border-top: 0; margin-top: 56px; padding-block: 44px 28px; }
.footer-grid { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 28px; }
.footer h5 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.footer ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; font-size: 14.5px; }
.footer ul button:hover { color: var(--red); }
.footer-base { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

/* ---------- Shop / filters ---------- */
.shop { display: grid; grid-template-columns: 264px minmax(0,1fr); gap: 32px; padding-top: 24px; align-items: start; }
.shop-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.shop-head h1 { font-size: clamp(28px, 3vw, 40px); }
.filters { position: sticky; top: calc(var(--hdr) + 60px); display: grid; gap: 4px; max-height: calc(100vh - var(--hdr) - 80px); overflow-y: auto; padding-right: 6px; scrollbar-width: thin; }
.fgroup { border-bottom: 1px solid var(--line); padding-block: 14px; }
.fgroup > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; font-weight: 750; font-size: 14.5px; cursor: pointer; }
.fgroup > summary::-webkit-details-marker { display: none; }
.fgroup[open] > summary .ic { transform: rotate(180deg); }
.fgroup .fbody { padding-top: 12px; display: grid; gap: 8px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14.5px; cursor: pointer; padding: 2px 0; }
.check input { appearance: none; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-2); background: var(--white); display: grid; place-items: center; flex: none; margin: 0; transition: all .15s; }
.check input:checked { background: var(--red); border-color: var(--red); }
.check input:checked::after { content: ""; width: 10px; height: 6px; border-left: 2px solid var(--white); border-bottom: 2px solid var(--white); transform: rotate(-45deg) translate(1px,-1px); }
.check input[type=radio] { border-radius: 50%; }
.check input[type=radio]:checked::after { width: 8px; height: 8px; border: 0; border-radius: 50%; background: var(--white); transform: none; }
.check .cnt { margin-left: auto; color: var(--muted); font-size: 12.5px; }
.size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.size-grid button { height: 38px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--white); font-weight: 650; font-size: 13.5px; }
.size-grid button.on { background: var(--ink); color: var(--white); border-color: var(--ink); }
.price-inputs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.price-inputs input { width: 100%; height: 40px; border-radius: 8px; border: 1.5px solid var(--line); padding: 0 10px; background: var(--white); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; font-size: 14.5px; }
.switch input { appearance: none; width: 42px; height: 24px; border-radius: 12px; background: var(--line-2); position: relative; flex: none; margin: 0; transition: background .2s; cursor: pointer; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--white); transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch input:checked { background: var(--red); }
.switch input:checked::after { transform: translateX(18px); }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 18px; }
.active-filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.af { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px 0 12px; border-radius: var(--r-pill); background: var(--ink); color: var(--white); font-size: 13px; font-weight: 600; }
.af .ic { width: 14px; height: 14px; }
.select { height: 40px; border-radius: var(--r-pill); border: 1.5px solid var(--line); background: var(--white); padding: 0 34px 0 14px; font-weight: 600; font-size: 14px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 18px) 17px, calc(100% - 13px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }
.filter-btn { display: none; }
.empty { text-align: center; padding: 60px 20px; background: var(--cream); border-radius: var(--r-lg); border: 1px dashed var(--line-2); display: grid; justify-items: center; gap: 10px; }
.empty .e-ic { width: 60px; height: 60px; border-radius: 50%; background: var(--blush); color: var(--red); display: grid; place-items: center; }
.empty h3 { font-size: 22px; }

/* Bottom sheet / drawer */
.overlay { position: fixed; inset: 0; background: rgba(31,20,20,.45); z-index: 80; animation: fade .2s ease; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--white); z-index: 90; display: flex; flex-direction: column; animation: slideIn .28s cubic-bezier(.2,.8,.2,1); box-shadow: var(--sh-2); }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; padding-top: calc(18px + env(safe-area-inset-top, 0px)); background: var(--white); border-bottom: 1px solid var(--line); }
.drawer-body .box { background: var(--cream); }
.drawer-head h3 { font-size: 22px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: grid; gap: 14px; align-content: start; }
.drawer-foot { padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--cream); border-top: 0; display: grid; gap: 12px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; background: var(--white); z-index: 90; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: slideUp .28s cubic-bezier(.2,.8,.2,1); }
.sheet .drawer-head { border-radius: 22px 22px 0 0; padding-top: 18px; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 0 auto 10px; }
@keyframes fade { from { opacity: 0 } }
@keyframes slideIn { from { transform: translateX(100%) } }
@keyframes slideUp { from { transform: translateY(100%) } }
.cart-group { background: var(--white); border-radius: var(--r-md); border: 1px solid var(--line); overflow: hidden; }
.cart-group-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.cart-group-head .muted { font-weight: 500; margin-left: auto; font-size: 12.5px; }
.cart-item { display: grid; grid-template-columns: 76px minmax(0,1fr) auto; gap: 12px; padding: 12px 14px; align-items: start; }
.cart-item + .cart-item { border-top: 1px solid var(--line); }
.cart-item img { width: 76px; height: 92px; border-radius: 10px; object-fit: cover; }
.cart-item h4 { font-family: var(--f-body); font-size: 14.5px; font-weight: 650; letter-spacing: 0; line-height: 1.3; }
.cart-item .ci-meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cart-item .ci-remove { font-size: 12.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; margin-top: 8px; }
.cart-item .ci-remove:hover { color: var(--red); }
.sum-row { display: flex; justify-content: space-between; font-size: 14.5px; }
.sum-row.total { font-size: 18px; font-weight: 800; font-family: var(--f-display); }

/* ---------- Product page ---------- */
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); padding-block: 18px; flex-wrap: wrap; }
.crumbs button:hover { color: var(--red); }
.pdp { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: start; }
.gallery { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 12px; position: sticky; top: calc(var(--hdr) + 60px); }
.g-thumbs { display: grid; gap: 8px; align-content: start; }
.g-thumbs button { aspect-ratio: 4/5; border-radius: 10px; overflow: hidden; border: 2px solid transparent; background: var(--cream-2); position: relative; }
.g-thumbs button.on { border-color: var(--red); }
.g-thumbs img { width: 100%; height: 100%; object-fit: cover; }
.g-thumbs span { position: absolute; left: 3px; right: 3px; bottom: 3px; font-size: 9.5px; font-weight: 700; background: rgba(255,255,255,.92); border-radius: 4px; text-align: center; padding: 1px 0; }
.g-main { position: relative; aspect-ratio: 4/5; border-radius: var(--r-lg); overflow: hidden; background: var(--cream-2); }
.g-main img { width: 100%; height: 100%; object-fit: cover; }
.g-main .g-label { position: absolute; left: 14px; bottom: 14px; }
.g-main .g-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: var(--white); display: grid; place-items: center; box-shadow: var(--sh-1); }
.g-main .g-nav.l { left: 12px; } .g-main .g-nav.r { right: 12px; }
.g-main .g-dots { position: absolute; bottom: 16px; left: 0; right: 0; display: none; justify-content: center; gap: 6px; }
.g-main .g-dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.6); }
.g-main .g-dots i.on { background: var(--white); width: 18px; }
.zoom-detail img { transform: scale(1.9); transform-origin: 40% 35%; }
.zoom-label img { transform: scale(2.6); transform-origin: 50% 20%; }
.pdp-info { display: grid; gap: 22px; }
.seller-mini { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--cream); border: 0; border-radius: var(--r-md); }
.seller-mini .store-logo { width: 44px; height: 44px; margin: 0; border-radius: 12px; font-size: 16px; border: 0; }
.seller-mini .sm-name { font-weight: 750; display: flex; align-items: center; gap: 5px; }
.seller-mini .sm-meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.pdp-title h1 { font-size: clamp(28px, 3vw, 38px); font-weight: 750; }
.pdp-title .brand { font-weight: 700; color: var(--red); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 8px; }
.pdp-price { display: flex; align-items: baseline; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.pdp-price .price { font-size: 32px; }
.pdp-price .was { color: var(--muted); font-size: 14px; }
.box { background: var(--cream); border: 0; border-radius: var(--r-md); padding: 18px; }
.box h4 { font-size: 15px; font-family: var(--f-body); font-weight: 800; letter-spacing: 0; display: flex; align-items: center; gap: 8px; }
.cond-box .cb-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.cond-box .cb-grade { font-family: var(--f-display); font-size: 22px; font-weight: 750; }
.cond-box .cb-desc { margin-top: 14px; font-size: 14px; color: var(--ink-2); }
.cond-box .cb-note { margin-top: 12px; padding: 12px 14px; background: var(--white); border-radius: 10px; font-size: 14px; display: flex; gap: 10px; }
.flaws { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.meas { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
.meas td { padding: 9px 0; border-bottom: 1px solid var(--line-2); }
.meas td:last-child { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.meas tr:last-child td { border-bottom: 0; }
.buy-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; }
.assure { display: grid; gap: 12px; }
.assure div { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
.assure .ic { color: var(--red); margin-top: 1px; }
.assure b { display: block; font-weight: 700; }
.assure span { color: var(--muted); }
.sticky-buy { display: none; }

/* ---------- Storefront ---------- */
.sf-banner { height: clamp(160px, 24vw, 280px); border-radius: 0 0 var(--r-lg) var(--r-lg); overflow: hidden; position: relative; background: var(--wine); }
.sf-banner img { width: 100%; height: 100%; object-fit: cover; opacity: .85; }
.sf-head { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 20px; align-items: end; margin-top: -48px; position: relative; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.sf-head .store-logo { width: 112px; height: 112px; border-radius: 28px; font-size: 40px; margin: 0; border-width: 5px; }
.sf-head h1 { font-size: clamp(28px, 3.4vw, 42px); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sf-badge { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 6px; border-radius: var(--r-pill); background: var(--blush); color: var(--red-deep); font-family: var(--f-body); font-size: 13px; font-weight: 750; letter-spacing: 0; }
.sf-badge.biz { background: var(--ink); color: var(--white); }
.sf-badge.biz .vbadge { color: var(--white); }
.sf-stats { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; color: var(--ink-2); }
.sf-stats b { font-family: var(--f-display); font-size: 18px; color: var(--ink); margin-right: 4px; }
.sf-body { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 32px; padding-top: 26px; align-items: start; }
.sf-about { display: grid; gap: 16px; position: sticky; top: calc(var(--hdr) + 20px); }
.socials { display: grid; gap: 8px; }
.socials div { display: flex; justify-content: space-between; font-size: 14px; gap: 8px; }
.socials span { color: var(--muted); }
.verify-note { font-size: 13px; color: var(--ink-2); background: var(--white); display: flex; gap: 8px; align-items: flex-start; border-radius: 10px; padding: 12px; }
.review { padding-block: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.stars { display: inline-flex; gap: 1px; color: var(--red); }
.stars .ic { width: 14px; height: 14px; fill: var(--red); stroke: none; }
.stars .ic.off { fill: var(--line-2); }

/* ---------- Forms ---------- */
.field { display: grid; gap: 6px; }
.field label, .lbl { font-weight: 700; font-size: 13.5px; }
.field .hint { font-size: 12.5px; color: var(--muted); }
.input, .textarea, .field select { width: 100%; height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--white); padding: 0 14px; font-size: 15px; outline: none; transition: border-color .15s; }
.field select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; }
.textarea { height: auto; min-height: 110px; padding: 12px 14px; resize: vertical; line-height: 1.5; }
.input:focus, .textarea:focus, .field select:focus { border-color: var(--ink); }
.input-pre { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; background: var(--white); overflow: hidden; }
.input-pre:focus-within { border-color: var(--ink); }
.input-pre span { padding: 0 4px 0 14px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.input-pre input { border: 0; height: 46px; flex: 1; min-width: 0; outline: none; padding: 0 14px 0 2px; background: transparent; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.radio-cards { display: grid; gap: 12px; }
.rcard { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--white); cursor: pointer; text-align: left; width: 100%; transition: border-color .15s, box-shadow .15s; }
.rcard:hover { border-color: var(--ink-2); }
.rcard.on { border-color: var(--red); box-shadow: 0 0 0 3px var(--blush); }
.rcard .rc-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-2); flex: none; margin-top: 2px; display: grid; place-items: center; }
.rcard.on .rc-dot { border-color: var(--red); }
.rcard.on .rc-dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
.rcard h4 { font-size: 16px; font-family: var(--f-body); font-weight: 800; letter-spacing: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rcard p { font-size: 13.5px; color: var(--muted); margin-top: 3px; }

/* ---------- Onboarding ---------- */
.ob { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: var(--white); }
.ob-visual { position: relative; background: var(--wine); overflow: hidden; color: var(--white); padding: 36px; display: flex; flex-direction: column; justify-content: space-between; isolation: isolate; }
.ob-collage { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1.2fr 1fr; gap: 10px; padding: 10px; z-index: -2; }
.ob-collage div { border-radius: 18px; overflow: hidden; background: var(--wine-2); }
.ob-collage div:first-child { grid-row: span 2; }
.ob-collage img { width: 100%; height: 100%; object-fit: cover; }
.ob-visual::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(59,10,18,.55), rgba(59,10,18,.1) 40%, rgba(59,10,18,.92)); z-index: -1; }
.ob-visual blockquote { margin: 0; font-family: var(--f-display); font-size: clamp(28px, 3vw, 44px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; max-width: 15ch; }
.ob-visual blockquote .serif { font-weight: 400; }
.ob-visual .ob-cap { margin-top: 14px; opacity: .8; max-width: 40ch; }
.ob-panel { padding: clamp(24px, 5vw, 64px); display: flex; flex-direction: column; gap: 28px; justify-content: center; max-width: 620px; width: 100%; margin: 0 auto; }
.ob-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.ob-steps { display: flex; gap: 6px; }
.ob-steps i { width: 28px; height: 4px; border-radius: 2px; background: var(--cream-2); }
.ob-steps i.f { background: var(--red); }
.ob h1 { font-size: clamp(32px, 4vw, 48px); font-weight: 800; letter-spacing: -0.035em; }
.ob .lead { font-size: 16.5px; color: var(--ink-2); margin-top: 10px; max-width: 46ch; }
.role-cards { display: grid; gap: 14px; }
.role { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 16px; align-items: center; padding: 20px; border-radius: var(--r-lg); border: 1.5px solid var(--line); background: var(--white); text-align: left; transition: all .18s; width: 100%; }
.role:hover { border-color: var(--red); box-shadow: 0 0 0 4px var(--blush); transform: translateY(-1px); }
.role .r-ic { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--blush); color: var(--red); }
.role.sell .r-ic { background: var(--wine); color: var(--white); }
.role h3 { font-size: 20px; }
.role p { font-size: 14px; color: var(--muted); margin-top: 3px; }
.role .r-go { width: 38px; height: 38px; border-radius: 50%; background: var(--cream); display: grid; place-items: center; }
.role:hover .r-go { background: var(--red); color: var(--white); }
.both-note { display: flex; gap: 12px; align-items: center; padding: 14px 16px; background: var(--cream); border-radius: var(--r-md); font-size: 14px; }
.both-note .ic { color: var(--red); }
.ob-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; }
.big-choice { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.big-choice.four { grid-template-columns: repeat(4, minmax(0,1fr)); }
.big-choice.four .bc-img { aspect-ratio: 1; }
.big-choice button { border: 1.5px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--white); text-align: left; transition: all .15s; }
.big-choice button .bc-img { aspect-ratio: 3/4; background: var(--cream-2); overflow: hidden; }
.big-choice button .bc-img img { width: 100%; height: 100%; object-fit: cover; }
.big-choice button div.bc-l { padding: 12px 14px; font-weight: 750; display: flex; justify-content: space-between; align-items: center; }
.big-choice button.on { border-color: var(--red); box-shadow: 0 0 0 3px var(--blush); }
.big-choice button.on .bc-l { color: var(--red); }
.social-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.plans-mini { display: grid; gap: 12px; }
.handle-preview { font-size: 13px; color: var(--muted); }
.handle-preview b { color: var(--ink); }
.done-hero { width: 76px; height: 76px; border-radius: 22px; background: var(--red); color: var(--white); display: grid; place-items: center; }
.done-hero .ic { width: 38px; height: 38px; stroke-width: 2.4; }

/* ---------- Seller Studio ---------- */
.studio { display: grid; grid-template-columns: 252px minmax(0,1fr); min-height: 100vh; background: var(--white); }
.side { background: var(--wine); color: var(--white); padding: 22px 16px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.side .logo-sub { font-family: var(--f-serif); font-style: italic; font-size: 17px; opacity: .7; margin-left: 2px; }
.side nav { display: grid; gap: 2px; }
.side nav button { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; font-weight: 600; font-size: 14.5px; color: rgba(255,255,255,.72); text-align: left; width: 100%; }
.side nav button:hover { background: rgba(255,255,255,.06); color: var(--white); }
.side nav button.on { background: rgba(255,255,255,.12); color: var(--white); }
.side nav button .pill { margin-left: auto; height: 22px; font-size: 11.5px; background: var(--red); color: var(--white); }
.side .side-cta { margin-top: 4px; }
.side .side-foot { margin-top: auto; display: grid; gap: 10px; }
.side .store-chip { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.06); }
.side .store-chip .store-logo { width: 38px; height: 38px; border-radius: 10px; margin: 0; border: 0; background: var(--red); font-size: 15px; }
.side .store-chip small { display: block; opacity: .65; font-size: 12px; }
.studio-main { min-width: 0; display: flex; flex-direction: column; }
.studio-top { display: flex; align-items: center; gap: 12px; height: 68px; padding: 0 clamp(16px, 3vw, 36px); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.94); backdrop-filter: blur(10px); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; }
.studio-top h2 { font-size: 22px; }
.studio-top .st-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.studio-body { padding: clamp(16px, 3vw, 36px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-content: start; }
.studio-mtop { display: none; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.kpi { background: var(--cream); border: 0; border-radius: var(--r-md); padding: 18px; display: grid; gap: 6px; }
.kpi .k-l { font-size: 13px; color: var(--muted); font-weight: 650; display: flex; align-items: center; gap: 6px; }
.kpi .k-v { font-family: var(--f-display); font-size: 30px; font-weight: 750; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.kpi .k-d { font-size: 12.5px; font-weight: 700; color: var(--ok); }
.kpi .k-d.down { color: var(--red); }
.kpi svg.spark { width: 100%; height: 36px; }
.panel { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-md); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-head h3 { font-size: 18px; }
.panel-body { padding: 18px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
.tbl th { text-align: left; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 12px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 12px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .t-item { display: flex; gap: 12px; align-items: center; min-width: 220px; }
.tbl .t-item img { width: 44px; height: 54px; border-radius: 8px; object-fit: cover; flex: none; }
.tbl .t-item b { font-weight: 650; display: block; }
.tbl .t-item small { color: var(--muted); }
.tbl .t-actions { display: flex; gap: 6px; justify-content: flex-end; }
.usage { display: grid; gap: 8px; }
.usage .bar { height: 10px; border-radius: 5px; background: var(--cream-2); overflow: hidden; }
.usage .bar i { display: block; height: 100%; background: var(--red); border-radius: 5px; }
.usage .u-row { display: flex; justify-content: space-between; font-size: 13.5px; }
.plan-card { background: var(--wine); color: var(--white); border-radius: var(--r-md); padding: 20px; display: grid; gap: 12px; }
.plan-card h3 { font-size: 22px; }
.plan-card .usage .bar { background: rgba(255,255,255,.15); }
.plan-card .usage .bar i { background: var(--white); }
.tip { display: flex; gap: 12px; padding: 14px; background: var(--blush); border-radius: 12px; font-size: 14px; color: var(--ink-2); }
.tip .ic { color: var(--red); }
.toprow { display: flex; gap: 12px; align-items: center; padding: 10px 0; }
.toprow + .toprow { border-top: 1px solid var(--line); }
.toprow img { width: 46px; height: 56px; border-radius: 8px; object-fit: cover; flex: none; }
.toprow .tr-t { min-width: 0; flex: 1; }
.toprow .tr-t b { display: block; font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toprow .tr-t small { color: var(--muted); font-size: 12.5px; }
.tabs-line { display: flex; gap: 24px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs-line button { height: 44px; font-weight: 700; font-size: 14.5px; color: var(--muted); border-bottom: 2.5px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tabs-line button.on { color: var(--ink); border-color: var(--red); }
.tabs-line button .n { font-size: 12px; background: var(--cream-2); border-radius: 10px; padding: 1px 7px; color: var(--ink-2); }

/* Listing editor */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
.stepper { display: flex; gap: 8px; flex-wrap: wrap; }
.stepper button { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: var(--r-pill); background: var(--white); border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; color: var(--muted); }
.stepper button b { width: 28px; height: 28px; border-radius: 50%; background: var(--cream-2); display: grid; place-items: center; font-size: 13px; color: var(--ink-2); }
.stepper button.on { border-color: var(--ink); color: var(--ink); }
.stepper button.on b { background: var(--red); color: var(--white); }
.stepper button.done b { background: var(--ink); color: var(--white); }
.photo-slots { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; }
.slot { aspect-ratio: 4/5; border-radius: 12px; border: 1.5px dashed var(--line-2); background: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--muted); position: relative; overflow: hidden; cursor: pointer; text-align: center; padding: 6px; }
.slot:hover { border-color: var(--red); color: var(--red); }
.slot.filled { border-style: solid; border-color: var(--line); padding: 0; }
.slot.filled img { width: 100%; height: 100%; object-fit: cover; }
.slot .slot-l { position: absolute; left: 6px; bottom: 6px; background: rgba(255,255,255,.94); color: var(--ink); padding: 2px 7px; border-radius: 5px; font-size: 11px; }
.slot .slot-x { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.94); display: grid; place-items: center; color: var(--ink); }
.slot.req::before { content: "Required"; position: absolute; top: 6px; left: 6px; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
.slot.locked { background: var(--cream); cursor: default; border-style: solid; }
.slot.locked:hover { border-color: var(--line-2); color: var(--muted); }
.slot input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.grade-cards { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.grade { text-align: left; padding: 16px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--white); display: grid; gap: 8px; transition: all .15s; }
.grade:hover { border-color: var(--ink-2); }
.grade.on { border-color: var(--red); box-shadow: 0 0 0 3px var(--blush); }
.grade .g-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.grade h4 { font-family: var(--f-display); font-size: 19px; }
.grade p { font-size: 13.5px; color: var(--muted); }
.grade ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); display: grid; gap: 2px; }
.notice { display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--wine); color: var(--white); font-size: 14px; align-items: flex-start; }
.notice .ic { color: var(--accent-soft); margin-top: 1px; }
.preview-col { position: sticky; top: 90px; display: grid; gap: 14px; }
.preview-col .pcard { background: var(--white); padding: 12px; border-radius: var(--r-md); border: 1px solid var(--line); }
.ed-actions { display: flex; justify-content: space-between; gap: 10px; padding-top: 6px; flex-wrap: wrap; }

/* Plans */
.plans { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; align-items: stretch; }
.plan { background: var(--white); border: 1.5px solid var(--line); border-radius: var(--r-lg); padding: 24px; display: flex; flex-direction: column; gap: 16px; position: relative; }
.plan.feat { border-color: var(--red); box-shadow: 0 0 0 4px var(--blush); }
.plan.dark { background: var(--wine); color: var(--white); border-color: var(--wine); }
.plan .p-name { font-family: var(--f-display); font-size: 24px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
.plan .p-price { font-family: var(--f-display); font-size: 38px; font-weight: 800; letter-spacing: -0.03em; }
.plan .p-price small { font-size: 15px; font-weight: 500; font-family: var(--f-body); opacity: .7; letter-spacing: 0; }
.plan ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 14px; }
.plan li { display: flex; gap: 10px; align-items: flex-start; }
.plan li .ic { color: var(--red); margin-top: 1px; width: 18px; height: 18px; }
.plan.dark li .ic { color: var(--accent-soft); }
.plan li.off { opacity: .45; }
.plan .btn { margin-top: auto; }
.compare { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
.compare th, .compare td { padding: 13px 16px; border-bottom: 1px solid var(--line); text-align: left; }
.compare th { font-family: var(--f-display); font-size: 16px; }
.compare td:first-child { font-weight: 650; }
.compare td small { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; }
.dur { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.dur button { padding: 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--white); text-align: left; display: grid; gap: 2px; }
.dur button b { font-family: var(--f-display); font-size: 20px; }
.dur button span { font-size: 13px; color: var(--muted); }
.dur button.on { border-color: var(--red); box-shadow: 0 0 0 3px var(--blush); }
.pick-list { display: grid; gap: 8px; max-height: 360px; overflow-y: auto; }
.pick { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--white); text-align: left; }
.pick img { width: 44px; height: 54px; border-radius: 8px; object-fit: cover; }
.pick.on { border-color: var(--red); }
.locked-card { position: relative; }
.locked-card .lock-over { position: absolute; inset: 0; background: rgba(255,255,255,.86); backdrop-filter: blur(2px); border-radius: var(--r-md); display: grid; place-items: center; text-align: center; padding: 20px; gap: 8px; align-content: center; justify-items: center; }

/* Checkout */
.checkout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: start; padding-top: 24px; }
.co-sum { position: sticky; top: calc(var(--hdr) + 70px); }
.pay-opts { display: grid; gap: 10px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 120; background: var(--ink); color: var(--white); padding: 12px 18px; border-radius: var(--r-pill); font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 10px; box-shadow: var(--sh-2); animation: toastIn .25s ease; max-width: calc(100% - 32px); }
.toast .ic { color: var(--accent-soft); }
.toast button { color: var(--accent-soft); font-weight: 700; margin-left: 6px; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } }
@media (max-width: 760px) { .toast { bottom: 92px; } }

/* Prototype screen jumper */
.jumper { position: fixed; right: 16px; bottom: 16px; z-index: 110; }
.jumper > button { height: 40px; padding: 0 14px; border-radius: var(--r-pill); background: var(--ink); color: var(--white); font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--sh-2); }
.jumper-pop { position: absolute; right: 0; bottom: 50px; width: 280px; max-height: 70vh; overflow-y: auto; background: var(--white); border-radius: var(--r-md); border: 1px solid var(--line); box-shadow: var(--sh-2); padding: 10px; }
.jumper-pop h6 { margin: 8px 8px 4px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.jumper-pop button { display: block; width: 100%; text-align: left; padding: 8px; border-radius: 8px; font-size: 14px; font-weight: 600; }
.jumper-pop button:hover { background: var(--cream); color: var(--red); }
@media (max-width: 760px) { .jumper { bottom: 92px; right: 12px; } .jumper > button span { display: none; } .jumper > button { width: 40px; padding: 0; justify-content: center; } }

/* Account */
.acct { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 28px; padding-top: 28px; align-items: start; }
.acct-card { background: var(--cream); border: 0; border-radius: var(--r-lg); padding: 22px; display: grid; gap: 16px; }
.mode-card { border-radius: var(--r-lg); padding: 22px; background: var(--wine); color: var(--white); display: grid; gap: 14px; }
.mode-card p { opacity: .8; font-size: 14px; }
.order-row { display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; }
.order-row + .order-row { border-top: 1px solid var(--line); }
.order-row img { width: 64px; height: 76px; border-radius: 10px; object-fit: cover; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .cat-rail { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .stores { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid.g4, .grid.feed { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .two-col, .editor { grid-template-columns: minmax(0,1fr); }
  .preview-col { position: static; }
  .promise { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .promise > div:nth-child(3) { border-left: 0; }
  .promise > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .studio { grid-template-columns: 220px minmax(0,1fr); }
  .hdr .mode-switch { display: none; }
}
@media (max-width: 900px) {
  .shop { grid-template-columns: minmax(0,1fr); }
  .shop .filters { display: none; }
  .filter-btn { display: inline-flex; }
  .pdp, .checkout, .acct, .sf-body { grid-template-columns: minmax(0,1fr); }
  .gallery, .co-sum, .sf-about { position: static; }
  .plans { grid-template-columns: minmax(0,1fr); }
  .sell-band { grid-template-columns: minmax(0,1fr); }
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .ob { grid-template-columns: minmax(0,1fr); }
  .ob-visual { min-height: 260px; padding: 24px; }
  .ob-visual .ob-cap { display: none; }
  .studio { grid-template-columns: minmax(0,1fr); }
  .side { display: none; }
  .studio-mtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--wine); color: var(--white); }
  .studio-top { top: 0; }
  .studio .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--white); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .studio .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 650; color: var(--muted); padding: 4px 0; }
  .studio .tabbar button.on { color: var(--red); }
  .studio .tabbar .tb-sell span.plus { width: 44px; height: 44px; margin-top: -18px; border-radius: 50%; background: var(--red); color: var(--white); display: grid; place-items: center; border: 3px solid var(--white); }
  .studio-body { padding-bottom: 96px; }
}
@media (max-width: 760px) {

  :root { --hdr: 58px; }
  .hdr-row { gap: 8px; }
  .hdr .search { display: none; }
  .hdr .hide-m { display: none; }
  .m-search { display: block; padding-bottom: 10px; }
  .m-search .search { display: block; max-width: none; }
  .logo-word { font-size: 23px; }
  .logo-mark { width: 30px; height: 30px; }
  .hero { grid-template-columns: minmax(0,1fr); }
  .hero-main { min-height: 300px; }
  .hero-side { grid-template-rows: none; grid-template-columns: minmax(0,1fr); }
  .cat-rail { display: flex; overflow-x: auto; scrollbar-width: none; gap: 14px; margin-inline: -16px; padding-inline: 16px; }
  .cat-rail::-webkit-scrollbar { display: none; }
  .cat-tile { flex: 0 0 72px; font-size: 12.5px; }
  .grid, .grid.g4, .grid.feed { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px 10px; }
  .pcard-media { border-radius: 12px; }
  .heart { width: 32px; height: 32px; }
  .pcard-top { top: 8px; left: 8px; right: 8px; }
  .pcard-bottom { left: 8px; bottom: 8px; }
  .price { font-size: 16px; }
  .add-cart { width: 34px; height: 34px; }
  .stores { display: flex; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
  .stores .store-card { flex: 0 0 78%; }
  .promise { grid-template-columns: minmax(0,1fr); }
  .promise > div + div { border-left: 0; border-top: 1px solid var(--line); }
  .feed-tabs { padding-top: 14px; }
  .seg { width: 100%; }

  .sticky-buy .price { font-size: 20px; margin-right: auto; }
  .pdp-page .tabbar { display: none; }
  .sf-head { grid-template-columns: minmax(0,1fr); gap: 12px; margin-top: -40px; }

@media (min-width: 761px) { .m-search { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.btn.saved { color: var(--red); border-color: var(--red); }
.btn.saved .ic { fill: var(--red); }

/* ---------- v2 additions ---------- */
.band { background: var(--cream); border-radius: var(--r-lg); padding: clamp(18px, 2.5vw, 28px); margin-block: 10px; }
.band .store-card { border-color: transparent; }
.dept-row { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin-bottom: 26px; }
.dept { position: relative; aspect-ratio: 4/3; border-radius: var(--r-lg); overflow: hidden; background: var(--cream); text-align: left; isolation: isolate; }
.dept img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.dept::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(31,20,20,0) 35%, rgba(31,20,20,.78)); z-index: -1; }

const IMG = { ok: 0, err: 0, blocked: false };
function pimg(src, alt, cat = "Vintage", color = "Red", w = 700, attrs = "") {
  const isData = String(src).startsWith("data:");
  const url = !src ? placeholder(cat, color) : isData ? src : (IMG.blocked ? placeholder(cat, color) : UNSPLASH(src, w));
  return `<img src="${url}" alt="${esc(alt)}" data-fb="${esc(cat + "|" + color)}" ${attrs}>`;
}
const prodImg = (p, w = 700, attrs = 'loading="lazy"') => pimg(p.img, p.title, p.cat, p.color, w, attrs);
document.addEventListener("load", (e) => { if (e.target.tagName === "IMG" && !e.target.src.startsWith("data:")) IMG.ok++; }, true);
document.addEventListener("error", (e) => {
  const el = e.target;
  if (el.tagName !== "IMG" || !el.dataset.fb || el.dataset.swapped) return;
  const [cat, color] = el.dataset.fb.split("|");
  el.dataset.swapped = "1";
  el.src = placeholder(cat, color);
  IMG.err++;
  if (!IMG.blocked && IMG.ok === 0 && IMG.err >= 3) {
    IMG.blocked = true;
    $$("img[data-fb]:not([data-swapped])").forEach(i => { const [c, co] = i.dataset.fb.split("|"); i.dataset.swapped = "1"; i.src = placeholder(c, co); });
  }
}, true);

/* ----- Shop + filters -----
   Faceted filtering: every group's counts are worked out against all the OTHER active
   filters, so a buyer always sees how many items each option would give them. */
const stem = (w) => w.length > 3 ? w.replace(/(es|s)$/, "") : w;
const LISTED = [["", "Any time"], ["1", "Last 24 hours"], ["7", "Last 7 days"], ["30", "Last 30 days"]];
const PRICE_PRESETS = [["Under ₦10k", "", 10000], ["₦10k–50k", 10000, 50000], ["₦50k–150k", 50000, 150000], ["₦150k–500k", 150000, 500000], ["₦500k–2M", 500000, 2000000], ["₦2M+", 2000000, ""]];
function matches(p, f, skip) {
  const s = api.seller(p.seller);
  const on = (k) => k !== skip;
  if (on("dept") && f.dept.length && !f.dept.includes(p.dept)) return false;
  if (on("cat") && f.cat.length && !f.cat.includes(p.cat)) return false;
  if (on("dep") && f.dep.length && (p.dept !== "Fashion" || !(f.dep.includes(p.dep) || p.dep === "U"))) return false;
  if (on("cond") && f.cond.length && !f.cond.includes(p.cond)) return false;
  if (on("extra") && f.extra && !p.extra) return false;
  if (on("noFlaws") && f.noFlaws && p.flaws.length) return false;
  if (on("tested") && f.tested && !p.tested) return false;
  if (on("origin") && f.origin.length && !f.origin.includes(p.origin)) return false;
  if (on("size") && f.size.length && !f.size.includes(p.size)) return false;
  if (on("brand") && f.brand.length && !f.brand.includes(p.brand)) return false;
  if (on("color") && f.color.length && !f.color.includes(p.color)) return false;
  if (on("price") && f.min && p.price < +f.min) return false;
  if (on("price") && f.max && p.price > +f.max) return false;
  if (on("city") && f.city.length && !f.city.includes(s.city)) return false;
  if (on("sellerType") && f.sellerType.length && !f.sellerType.includes(s.type)) return false;
  if (on("verified") && f.verified && !s.verified) return false;
  if (on("deliver") && f.deliver && !p.deliver) return false;
  if (on("pickup") && f.pickup && !p.pickup) return false;
  if (on("offers") && f.offers && !p.offers) return false;
  if (on("listed") && f.listed && p.days > +f.listed) return false;
  return true;
}
function filtered(skip) {
  const f = S.f;
  let list = PRODUCTS.map(p => ({ p, score: 1 }));
  if (f.q) {
    const words = f.q.toLowerCase().split(/[\s,]+/).filter(Boolean).map(stem);
    list = list.map(({ p }) => {
      const s = api.seller(p.seller);
      const hay = [p.title, p.brand, p.cat, p.dept, p.color, p.size, p.origin, ...p.styles, s.name, GRADES[p.cond - 1].name].join(" ").toLowerCase();
      return { p, score: words.filter(w => hay.includes(w)).length };
    }).filter(x => x.score > 0);
  }
  list = list.filter(({ p }) => matches(p, f, skip));
  const sorters = { rec: (a, b) => b.score - a.score || b.p.saves - a.p.saves, new: (a, b) => a.p.days - b.p.days, low: (a, b) => a.p.price - b.p.price, high: (a, b) => b.p.price - a.p.price, saved: (a, b) => b.p.saves - a.p.saves };
  return list.sort(sorters[f.sort] || sorters.rec).map(x => x.p);
}
const FLAG_LABELS = { extra: "Tags on / boxed / papers", noFlaws: "No flaws", tested: "Tested & working", verified: "Verified sellers", deliver: "Seller delivers", pickup: "Pickup available", offers: "Open to offers" };
function activeFilters() {
  const f = S.f, out = [];
  f.dept.forEach(v => out.push(["dept", v, v]));
  f.cat.forEach(v => out.push(["cat", v, v]));
  f.dep.forEach(v => out.push(["dep", v, { W: "Women", M: "Men", U: "Unisex" }[v]]));
  f.cond.forEach(v => out.push(["cond", v, GRADES[v - 1].name]));
  f.size.forEach(v => out.push(["size", v, v]));
  f.brand.forEach(v => out.push(["brand", v, v]));
  f.color.forEach(v => out.push(["color", v, v]));
  f.origin.forEach(v => out.push(["origin", v, v]));
  if (f.min || f.max) out.push(["price", 0, `${f.min ? naira(f.min) : "₦0"} – ${f.max ? naira(f.max) : "any"}`]);
  f.city.forEach(v => out.push(["city", v, v]));
  f.sellerType.forEach(v => out.push(["sellerType", v, v === "store" ? "Stores" : "Individual sellers"]));
  if (f.listed) out.push(["listed", f.listed, LISTED.find(x => x[0] === f.listed)[1]]);
  Object.keys(FLAG_LABELS).forEach(k => { if (f[k]) out.push([k, true, FLAG_LABELS[k]]); });
  return out;
}

  }

}

function spark(arr, color = "var(--red)") {
  const max = Math.max(...arr), min = Math.min(...arr);
  const pts = arr.map((v, i) => [(i / (arr.length - 1)) * 100, 32 - ((v - min) / (max - min || 1)) * 28]);
  const line = pts.map(p => p.join(",")).join(" ");
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true"><path d="M0,36 L${line.replace(/ /g, " L")} L100,36 Z" fill="${color}" opacity=".1"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`;
}

const OB_ROUTES = ["ob-dep", "ob-style", "ob-done", "ob-sell", "ob-quick", "ob-store", "ob-plan", "ob-ready"];
function render() {
  const parts = CUR.split("/"), r = parts[0], a = parts[1];
  let html;
  const shopping = (inner, extraClass = "") => `<div class="page ${extraClass}">${header()}${inner}${footer()}${tabbar()}</div>`;
  if (r === "studio" && !mySeller()) { S.ob.role = "sell"; CUR = S.user ? "ob-sell" : "signup"; return render(); }
  if (OB_ROUTES.includes(r) && !S.user) { CUR = "signup"; return render(); }
  if (r === "ob-ready" && !isStore()) { CUR = "ob-store"; return render(); }
  switch (r) {
    case "welcome": html = viewWelcome(); break;
    case "signup": html = viewSignup(); break;
    case "signin": html = viewSignin(); break;
    case "ob-dep": html = viewObDep(); break;
    case "ob-style": html = viewObStyle(); break;
    case "ob-done": html = viewObDone(); break;
    case "ob-sell": html = viewObSell(); break;
    case "ob-quick": html = viewObQuick(); break;
    case "ob-store": html = viewObStore(); break;
    case "ob-plan": html = viewObPlan(); break;
    case "ob-ready": html = viewObStoreDone(); break;
    case "studio":
      S.mode = "seller";
      html = !a ? viewStudioHome() : a === "listings" ? viewStudioListings() : a === "orders" ? viewStudioOrders() : a === "promote" ? viewStudioPromote() : a === "storefront" ? viewStudioStorefront() : a === "plans" ? viewStudioPlans() : a === "new" ? viewStudioNew() : viewStudioHome();
      break;
    case "shop": html = shopping(viewShop()); break;
    case "product": html = shopping(viewProduct(a), "pdp-page"); break;
    case "store": html = shopping(viewStore(a)); break;
    case "saved": html = shopping(viewSaved()); break;
    case "account": html = shopping(viewAccount()); break;
    case "checkout": html = shopping(viewCheckout()); break;
    case "order": html = shopping(viewOrderDone(a)); break;
    default: CUR = "home"; html = shopping(viewHome());
  }
  if (r !== "studio" && !OB_ROUTES.includes(r) && !["welcome", "signup", "signin"].includes(r)) S.mode = "buyer";
  $("#app").innerHTML = html;
  renderLayer();
  save();
}
function renderLayer() {
  const open = !!(ui.cart || ui.sheet);
  if (open && !ui.layerWasOpen) ui.anim = true;   // slide in only when the panel first opens, not on every re-render
  $("#layer").innerHTML = layerHTML();
  ui.anim = false; ui.layerWasOpen = open;
  $("#jump").innerHTML = open ? "" : jumperHTML();
  document.body.style.overflow = open ? "hidden" : "";
}
